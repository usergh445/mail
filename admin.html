<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>admin_panel.sh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent-green: #3fb950;
      --accent-blue: #58a6ff;
      --accent-cyan: #39c5cf;
      --accent-amber: #d29922;
      --accent-red: #f85149;
      --btn-hover: #21262d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fira Code', monospace; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1.5rem; }
    .terminal { width: 100%; max-width: 650px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
    .terminal-header { background: rgba(0, 0, 0, 0.3); padding: 10px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
    .window-dots { display: flex; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red { background: #ff5f56; } .dot-yellow { background: #ffbd2e; } .dot-green { background: #27c93f; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .nav-btn { background: none; border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 4px; padding: 2px 6px; font-size: 0.7rem; cursor: pointer; text-decoration: none; }
    .nav-btn:hover { color: var(--accent-green); border-color: var(--accent-green); }
    .terminal-body { padding: 1.5rem; }
    .section-title { font-size: 0.8rem; color: var(--accent-cyan); margin-bottom: 0.8rem; text-transform: uppercase; }
    .input-box { width: 100%; padding: 0.8rem; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; font-family: inherit; margin-bottom: 0.8rem; font-size: 0.85rem; }
    .btn { display: flex; align-items: center; justify-content: space-between; width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.8rem 1rem; border-radius: 6px; font-size: 0.85rem; text-decoration: none; cursor: pointer; margin-bottom: 0.5rem; }
    .btn:hover { background: var(--btn-hover); border-color: var(--accent-blue); }
    .btn-prefix { color: var(--accent-green); margin-right: 8px; }
    .btn-danger { border-color: rgba(248, 81, 73, 0.4); color: var(--accent-red); padding: 4px 8px; font-size: 0.75rem; background: none; cursor: pointer; border-radius: 4px; }
    .btn-danger:hover { background: rgba(248, 81, 73, 0.1); border-color: var(--accent-red); }
    .list-item { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); padding: 0.8rem; border-radius: 6px; margin-bottom: 0.5rem; font-size: 0.85rem; }
    .hidden { display: none; }
    #toast { position: fixed; bottom: 20px; right: 20px; background: var(--accent-green); color: #000; font-weight: bold; padding: 12px 20px; border-radius: 6px; font-size: 0.85rem; opacity: 0; transition: all 0.3s ease; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="terminal">
    <div class="terminal-header">
      <div class="window-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
      <div class="header-right">
        <a href="index.html" class="nav-btn">[VIEW SITE]</a>
        <button id="logout-btn" class="nav-btn hidden" onclick="handleLogout()">[LOGOUT]</button>
      </div>
    </div>

    <div class="terminal-body">
      <!-- LOGIN SECTION -->
      <div id="login-section">
        <div class="section-title">> Authenticate Admin Session:</div>
        <input type="email" id="login-email" class="input-box" placeholder="admin_email@domain.com">
        <input type="password" id="login-pass" class="input-box" placeholder="password">
        <button class="btn" onclick="handleLogin()">
          <span><span class="btn-prefix">[&rarr;]</span> Login to Terminal</span>
        </button>
      </div>

      <!-- DASHBOARD SECTION -->
      <div id="dashboard-section" class="hidden">
        <div class="section-title">> Add New Dynamic Link:</div>
        <input type="text" id="link-title" class="input-box" placeholder="Link Title (e.g., YouTube Channel)">
        <input type="text" id="link-url" class="input-box" placeholder="Target URL (e.g., https://youtube.com)">
        <button class="btn" onclick="addLink()" style="margin-bottom: 1.5rem;">
          <span><span class="btn-prefix">[+]</span> Publish Link</span>
        </button>

        <div class="section-title">> Existing Links & Analytics:</div>
        <div id="admin-links-list" style="margin-bottom: 1.5rem;"></div>

        <div class="section-title">> Subscribers List:</div>
        <div id="subscribers-list"></div>
      </div>
    </div>
  </div>

  <div id="toast">[SYSTEM] Action Completed!</div>

  <script>
    const SUPABASE_URL = "https://kfeleqmrqzupsagyxziu.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmZWxlcW1ycXp1cHNhZ3l4eml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNTYxNTAsImV4cCI6MjEwMTgzMjE1MH0.KlS561gwKF--Thi6hklnri5knTPF1v0u4aU_25EIils";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Initial Auth Guard Check
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        showDashboard();
      } else {
        showLogin();
      }
    }

    function showLogin() {
      document.getElementById('login-section').classList.remove('hidden');
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('logout-btn').classList.add('hidden');
    }

    function showDashboard() {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      document.getElementById('logout-btn').classList.remove('hidden');
      loadAdminData();
    }

    async function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-pass').value.trim();
      if (!email || !password) return showToast("[ERROR] Fill in all credentials");

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        showToast(`[ERROR] ${error.message}`);
      } else {
        showToast("[SUCCESS] Authenticated!");
        showDashboard();
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      showToast("[SYSTEM] Logged out");
      showLogin();
    }

    async function loadAdminData() {
      // Load Links
      const { data: links } = await supabaseClient.from('site_links').select('*').order('created_at', { ascending: false });
      const linksContainer = document.getElementById('admin-links-list');
      if (links && links.length > 0) {
        linksContainer.innerHTML = links.map(l => `
          <div class="list-item">
            <div>
              <strong style="color: var(--accent-green);">${l.title}</strong><br>
              <span style="font-size: 0.75rem; color: var(--text-muted);">${l.url}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
              <span style="color: var(--accent-amber); font-weight: bold;">${l.click_count || 0} clicks</span>
              <button class="btn-danger" onclick="deleteLink('${l.id}')">Delete</button>
            </div>
          </div>
        `).join('');
      } else {
        linksContainer.innerHTML = '<div style="font-size: 0.8rem; color: var(--text-muted);">No links configured.</div>';
      }

      // Load Subscribers
      const { data: subs } = await supabaseClient.from('subscribers').select('*').order('created_at', { ascending: false });
      const subsContainer = document.getElementById('subscribers-list');
      if (subs && subs.length > 0) {
        subsContainer.innerHTML = subs.map(s => `
          <div class="list-item">
            <span>${s.email}</span>
            <span style="font-size: 0.75rem; color: var(--text-muted);">${new Date(s.created_at).toLocaleDateString()}</span>
          </div>
        `).join('');
      } else {
        subsContainer.innerHTML = '<div style="font-size: 0.8rem; color: var(--text-muted);">No subscribers yet.</div>';
      }
    }

    async function addLink() {
      const title = document.getElementById('link-title').value.trim();
      let url = document.getElementById('link-url').value.trim();

      if (!title || !url) return showToast("[ERROR] Enter title and URL");

      // Auto-prefix URL with https:// if user omits protocol
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }

      const { error } = await supabaseClient.from('site_links').insert([{ title, url }]);
      if (error) {
        showToast(`[ERROR] ${error.message}`);
      } else {
        showToast("[SUCCESS] Link added!");
        document.getElementById('link-title').value = '';
        document.getElementById('link-url').value = '';
        loadAdminData();
      }
    }

    async function deleteLink(id) {
      const { error } = await supabaseClient.from('site_links').delete().eq('id', id);
      if (error) {
        showToast(`[ERROR] ${error.message}`);
      } else {
        showToast("[SUCCESS] Link removed!");
        loadAdminData();
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    checkAuth();
  </script>
</body>
</html>
